name: Build & Release OpenCMTools

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build native .NET 4.8 MECM icon resource assemblies (Duotone & Outline)
        shell: powershell
        run: |
          & ".\installer\scripts\Build-IconsDll.ps1" -IconsDir "src\OpenCMTools.Icons\Icons" -OutputDll "src\OpenCMTools.Icons\bin\Release\net48\OpenCMTools.Icons.Duotone.dll"
          & ".\installer\scripts\Build-IconsDll.ps1" -IconsDir "src\OpenCMTools.Icons\IconsOutline" -OutputDll "src\OpenCMTools.Icons\bin\Release\net48\OpenCMTools.Icons.Outline.dll"

      - name: Restore dependencies
        run: dotnet restore OpenCMTools.sln

      - name: Build full solution (Release)
        run: dotnet build OpenCMTools.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/OpenCMTools.Tests/OpenCMTools.Tests.csproj -c Release --no-build --verbosity normal

      - name: Validate installer scripts with Windows PowerShell 5.1 parser
        shell: powershell
        run: |
          $ErrorActionPreference = "Stop"
          $scripts = Get-ChildItem -Path "installer" -Recurse -Filter "*.ps1"
          if ($scripts.Count -eq 0) { throw "No PowerShell scripts found under installer/." }
          foreach ($s in $scripts) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile($s.FullName, [ref]$tokens, [ref]$errors)
            if ($errors -and $errors.Count -gt 0) {
              $msg = ($errors | ForEach-Object { "$($s.Name):$($_.Extent.StartLineNumber):$($_.Extent.StartColumnNumber) $($_.Message)" }) -join "`n"
              throw "PowerShell 5.1 syntax errors detected:`n$msg"
            }
            Write-Host "PowerShell 5.1 parse OK: $($s.FullName)"
          }

      - name: Build WiX v4 MSI installer
        run: dotnet build installer/OpenCMTools.Installer/OpenCMTools.Installer.wixproj -c Release

      - name: Assemble portable ZIP package
        shell: pwsh
        run: |
          $stage = "artifacts/OpenCMTools-portable"
          New-Item -ItemType Directory -Path "$stage/bin", "$stage/scripts", "$stage/console-bridge-src", "$stage/console-extensions" -Force | Out-Null
          Copy-Item "src/OpenCMTools.App/bin/Release/net48/*" "$stage/bin/" -Recurse -Force
          Copy-Item "src/OpenCMTools.ConsoleExtension/bin/Release/net48/OpenCMTools.ConsoleExtension.dll" "$stage/bin/" -Force
          Copy-Item "src/OpenCMTools.Icons/bin/Release/net48/OpenCMTools.Icons.Duotone.dll" "$stage/bin/" -Force
          Copy-Item "src/OpenCMTools.Icons/bin/Release/net48/OpenCMTools.Icons.Outline.dll" "$stage/bin/" -Force
          Copy-Item "installer/scripts/*" "$stage/scripts/" -Force
          Copy-Item "src/OpenCMTools.ConsoleExtension/*.cs" "$stage/console-bridge-src/" -Force
          Copy-Item "console-extensions/*" "$stage/console-extensions/" -Recurse -Force
          Copy-Item "LICENSE", "README.md" "$stage/" -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/OpenCMTools-portable.zip" -Force
          $msi = Get-ChildItem "installer/OpenCMTools.Installer/bin" -Recurse -Filter "OpenCMTools.msi" | Select-Object -First 1
          if (-not $msi) { throw "OpenCMTools.msi was not produced by WiX build." }
          Copy-Item $msi.FullName "artifacts/OpenCMTools.msi" -Force
          Get-FileHash "artifacts/OpenCMTools.msi", "artifacts/OpenCMTools-portable.zip" -Algorithm SHA256 | Format-Table -AutoSize | Out-File "artifacts/SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenCMTools-Release
          path: |
            artifacts/OpenCMTools.msi
            artifacts/OpenCMTools-portable.zip
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/OpenCMTools.msi
            artifacts/OpenCMTools-portable.zip
            artifacts/SHA256SUMS.txt
