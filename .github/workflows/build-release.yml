name: Build & Release OpenRCT

on:
  push:
    branches: [ main ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Restore dependencies
        run: dotnet restore OpenRCT.sln

      - name: Build full solution (Release)
        run: dotnet build OpenRCT.sln -c Release --no-restore

      - name: Run unit tests
        run: dotnet test tests/OpenRCT.Tests/OpenRCT.Tests.csproj -c Release --no-build --verbosity normal

      - name: Build WiX v4 MSI installer
        run: dotnet build installer/OpenRCT.Installer/OpenRCT.Installer.wixproj -c Release

      - name: Assemble portable ZIP package
        shell: pwsh
        run: |
          $stage = "artifacts/OpenRCT-portable"
          New-Item -ItemType Directory -Path "$stage/bin", "$stage/scripts", "$stage/console-bridge-src", "$stage/console-extensions" -Force | Out-Null
          Copy-Item "src/OpenRCT.App/bin/Release/net48/*" "$stage/bin/" -Recurse -Force
          Copy-Item "src/OpenRCT.ConsoleExtension/bin/Release/net48/OpenRCT.ConsoleExtension.dll" "$stage/bin/" -Force
          Copy-Item "installer/scripts/*" "$stage/scripts/" -Force
          Copy-Item "src/OpenRCT.ConsoleExtension/*.cs" "$stage/console-bridge-src/" -Force
          Copy-Item "console-extensions/*" "$stage/console-extensions/" -Recurse -Force
          Copy-Item "LICENSE", "README.md" "$stage/" -Force
          Compress-Archive -Path "$stage/*" -DestinationPath "artifacts/OpenRCT-portable.zip" -Force
          $msi = Get-ChildItem "installer/OpenRCT.Installer/bin" -Recurse -Filter "OpenRCT.msi" | Select-Object -First 1
          if (-not $msi) { throw "OpenRCT.msi was not produced by WiX build." }
          Copy-Item $msi.FullName "artifacts/OpenRCT.msi" -Force
          Get-FileHash "artifacts/OpenRCT.msi", "artifacts/OpenRCT-portable.zip" -Algorithm SHA256 | Format-Table -AutoSize | Out-File "artifacts/SHA256SUMS.txt"

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: OpenRCT-Release
          path: |
            artifacts/OpenRCT.msi
            artifacts/OpenRCT-portable.zip
            artifacts/SHA256SUMS.txt

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            artifacts/OpenRCT.msi
            artifacts/OpenRCT-portable.zip
            artifacts/SHA256SUMS.txt
